# ??? ??
spring.application.name=RecommendSystem
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


#spring.devtools.restart.exclude=uploads/**
#spring.devtools.livereload.enabled=true
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

spring.freemarker.cache=false
# ===== Actuator 노출 최소화 =====
# 이 앱은 spring-security 없이 공인망에 떠 있으므로 인증 없는 엔드포인트가 곧 공개 API다.
# 특히 heapdump 는 힙 전체(DB/Redis 비밀번호, 세션, 사용자 데이터)를 그대로 내려준다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# include 로 이미 차단되지만, 설정 실수 대비용 이중 차단
management.endpoint.heapdump.access=none
management.endpoint.env.access=none
management.endpoint.loggers.access=none

# ????? ??
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.type-aliases-package=shop/RecommendSystem/dto
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ?? ??
logging.level.org.apache.ibatis=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.web=DEBUG

#?? ?? ??
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# db ?? ??
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}

#spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
#spring.datasource.username=system
#spring.datasource.password=oracle

# redis
spring.data.redis.host=${redis_host}
spring.data.redis.port=${redis_port}
spring.data.redis.password=${redis_password}

# ?? ??
project_path = ${project_path}


cd /source/recommandSystem/backend grep -a 'exec-379\]' app.log
## ?? ?? ??
connectPath = ${connectPath}
resourcePath=${resourcePath}

## ?? api
fastApiUrl=${fastApi_url}
hostInfo=http://localhost:8080

pq.codebook.path=${pqCodebookPath}
pq.candidate.size=${pqCandidateSize}

# 비우면 IVF off (exhaustive ADC 폴백). coarse.npy 경로 지정 시 IVF on.
pq.coarse.path=${pqCoarsePath}
pq.nprobe=${pqNprobe}

# ===== 접근 로그 (access_log 테이블) =====
# 요청 기록을 DB에 남긴다. 문제 시 false 로 즉시 중단 가능(외부 config 로 override).
accesslog.enabled=true
# IP/세션ID/UA 는 결합 시 개인 식별이 가능하므로 보관기간을 둔다
accesslog.retention-days=90
accesslog.suspicious-retention-days=365
